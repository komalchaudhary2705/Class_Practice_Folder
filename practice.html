<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-info">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Practice-Work</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            PracticeWork link
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="practice.html">Practice One</a></li>
                            <li><a class="dropdown-item" href="imageGallery.html">Practice Two</a></li>
                            <li><a class="dropdown-item" href="products.html">Practice Three</a></li>
                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="container w-full min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row">
            <div class="col-12 d-flex flex-column">
                <img id="bulb-img" src="./images/bulb-off.jpg" alt="bulb-image" width="200px">
                <div class="mt-3">
                    <button id="onsrc" class="btn btn-info px-4 py-2">Bulb On</button>
                    <button id="offsrc" class="btn btn-info px-4 py-2">Bulb Off</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const image = document.getElementById("bulb-img");
        const onImageSrc = document.getElementById("onsrc");
        const offImageSrc = document.getElementById("offsrc");

        onImageSrc.addEventListener("click", () => {
            image.src = "./images/bulb-on.jpg"
        })
        offImageSrc.addEventListener("click", () => {
            image.src = "./images/bulb-off.jpg"
        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
