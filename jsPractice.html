<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Journey</title>
</head>

<body>

    <h1>Variables Scope</h1>

    <script>
        // global scope
        var a = "global var";
        let b = "global let";
        const c = 'global const';
        //  function scope
        function test() {
            var a = "function var";
            let b = "function let";
            const c = 'function const';
            document.write("<br/>")
            document.write("<br/>")
            document.write("<p>inside function values</p>")
            document.write(a);
            document.write("<br/>")
            document.write(b)
            document.write("<br/>")
            document.write(c)

        }
        test()

        document.write("<br/>")
        document.write("<br/>")
        document.write("<p>outside function values</p>")
        document.write(a);
        document.write("<br/>")
        document.write(b)
        document.write("<br/>")
        document.write(c)

        // block scope
        {
            var a = "block var";
            let b = "block let";
            const c = 'block const';
            document.write("<br/>")
            document.write("<br/>")
            document.write("<p>inside block values</p>")
            document.write(a);
            document.write("<br/>")
            document.write(b)
            document.write("<br/>")
            document.write(c)
        }
        document.write("<br/>")
        document.write("<br/>")
        document.write("<p>outside block values</p>")
        document.write(a);
        document.write("<br/>")
        document.write(b)
        document.write("<br/>")
        document.write(c)



    </script>
</body>

</html>
