    <div class="container">
       <h1>Variables Scope</h1>
     <script>
        // global scope
        var a = "global var";
        let b = "global let";
        const c = 'global const';
        //  function scope
        function test() {
            var a = "function var";
            let b = "function let";
            const c = 'function const';
            document.write("<br/>")
            document.write("<br/>")
            document.write("<p>inside function values</p>")
            document.write(a);
            document.write("<br/>")
            document.write(b)
            document.write("<br/>")
            document.write(c)

        }
        test()

        document.write("<br/>")
        document.write("<br/>")
        document.write("<p>outside function values</p>")
        document.write(a);
        document.write("<br/>")
        document.write(b)
        document.write("<br/>")
        document.write(c)

        // block scope
        {
            var a = "block var";
            let b = "block let";
            const c = 'block const';
            document.write("<br/>")
            document.write("<br/>")
            document.write("<p>inside block values</p>")
            document.write(a);
            document.write("<br/>")
            document.write(b)
            document.write("<br/>")
            document.write(c)
        }
        document.write("<br/>")
        document.write("<br/>")
        document.write("<p>outside block values</p>")
        document.write(a);
        document.write("<br/>")
        document.write(b)
        document.write("<br/>")
        document.write(c)
