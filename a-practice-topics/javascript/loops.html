<body>

    <script>
        console.log("========================")

        console.log("========================")

        // print 1 to 5
        for(let i=1; i<=5;i++){
        console.log(i)
        }

        // loop scope
        let j = 5;
        for (let j = 0; j < 10; j++) {

        }

        let k = 5;

        }
