<body>
    <nav class="navbar navbar-expand-lg bg-info">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Project-2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            PracticeWork link

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="practice.html">Practice One</a></li>
                            <li><a class="dropdown-item" href="imageGallery.html">Practice Two</a></li>

                        </ul>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="container w-full min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row">
            <div class="col-12 d-flex flex-md-row flex-column gap-2">
                <div class="d-flex flex-row flex-md-column gap-2 align-items-center justify-content-center">
                    <a href="">
                        <img id="img1" width="70px" height="70px" src="./images/camera.jpg" alt="">
                    </a>
                    <a href="">
                        <img id="img2" width="70px" height="70px" src="./images/headphone.jpg" alt="">
                    </a>
                    <a href="">
                        <img id="img3" width="70px" height="70px" src="./images/watch.jpg" alt="">
                    </a>
                </div>
                <div><img id="main-img" src="./images/sport-shoes.jpg" width="400px" alt=""></div>
            </div>
        </div>
    </div>

    <script>
        const mainImg = document.getElementById("main-img");
        const img1 = document.getElementById("img1");
        const img2 = document.getElementById("img2");
        const img3 = document.getElementById("img3");
        img1.addEventListener("click", () => {
            event.preventDefault();
            mainImg.src = "./images/camera.jpg"
        })
        img2.addEventListener("click", () => {
            event.preventDefault();
            mainImg.src = "./images/headphone.jpg"
        })
        img3.addEventListener("click", () => {
            event.preventDefault();
            mainImg.src = "./images/watch.jpg"

        })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

        crossorigin="anonymous"></script>
